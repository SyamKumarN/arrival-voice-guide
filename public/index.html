<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5563">
  <title>Arrival Guide (Voice)</title>
  <meta name="description" content="Speak your airport and terminal. Get walked, step by step, to a fair currency exchange counter.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b5563'/%3E%3Crect x='25' y='14' width='14' height='24' rx='7' fill='white'/%3E%3Cpath d='M19 32a13 13 0 0 0 26 0' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M32 45v6' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 6-6.9h-2Z"/></svg>
        </span>
        <div>
          <h1>Arrival Guide</h1>
          <p class="sub">JesTiny Guide · Voice</p>
        </div>
      </div>
      <button class="ghost small" id="restartBtn" type="button"></button>
    </header>

    <nav class="langs" id="langs" aria-label="Language">
      <button type="button" class="chip" data-lang="en-IN">English</button>
      <button type="button" class="chip" data-lang="hi-IN">हिंदी · Hinglish</button>
      <button type="button" class="chip" data-lang="te-IN">తెలుగు</button>
    </nav>

    <section class="place" id="place" aria-live="polite"></section>

    <section class="card talk" aria-live="polite">
      <p class="heard" id="heard" hidden><span class="label" id="youSaidLabel"></span> <span id="heardText"></span></p>
      <p class="reply" id="reply"></p>
      <p class="notice" id="notice" hidden></p>
      <!-- Tap choices for whatever was just asked (airport, terminal, yes/no, next tip) -->
      <div class="choices" id="choices"></div>
    </section>

    <div class="quick" id="quick">
      <button type="button" class="ghost small" id="tipsBtn"></button>
      <button type="button" class="ghost small" id="trapsBtn"></button>
      <button type="button" class="ghost small save-btn" id="saveBtn"></button>
    </div>

    <section class="card save" id="savePanel" hidden aria-live="polite">
      <p id="saveStatus"></p>
      <p class="lang-tip"><strong id="langTipTitle"></strong> <span id="langTip"></span></p>
      <button type="button" class="ghost small" id="installBtn" hidden></button>
    </section>

    <section class="card price" id="priceCard" hidden>
      <h2 id="priceTitle"></h2>
      <div class="price-grid">
        <div><span class="label" id="offeredLabel"></span><strong id="offeredVal"></strong></div>
        <div><span class="label" id="fairLabel"></span><strong id="fairVal"></strong></div>
      </div>
      <p class="badge" id="priceBadge"></p>
      <p class="muted small" id="priceRate"></p>
    </section>

    <section class="card steps" id="stepsCard" hidden>
      <h2 id="stepsTitle"></h2>
      <div class="best" id="best"></div>
      <ol id="steps"></ol>
      <ul class="warn" id="warnings"></ul>
      <p class="checked" id="checked"></p>
    </section>

    <section class="tries">
      <h2 id="tryTitle"></h2>
      <div class="try-list" id="tries"></div>
    </section>

    <form class="type" id="typeForm" autocomplete="off">
      <input id="typeInput" type="text" enterkeyhint="send" aria-label="Type a message">
      <button type="submit" class="ghost" id="sendBtn"></button>
    </form>

    <footer class="foot">
      <p id="ratesInfo"></p>
      <p id="upgrades"></p>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="handsFree" checked> <span id="handsFreeLabel"></span></label>
        <label class="toggle"><input type="checkbox" id="slower"> <span id="slowerLabel"></span></label>
      </div>
    </footer>
  </div>

  <div class="dock">
    <button type="button" class="side" id="repeatBtn"></button>
    <div class="mic-wrap">
      <button type="button" class="mic" id="micBtn" aria-describedby="micStatus">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1a7 7 0 0 0 6-6.9h-2Z"/></svg>
      </button>
      <span class="mic-status" id="micStatus"></span>
    </div>
    <button type="button" class="side" id="nextBtn"></button>
    <div class="dock-top">
      <button type="button" class="cant" id="cantBtn"></button>
      <button type="button" class="staff-btn" id="staffBtn"></button>
    </div>
  </div>

  <!-- Ask-staff card: big, high-contrast, same look in light and dark mode -->
  <div class="staff-card" id="staffCard" role="dialog" aria-modal="true" aria-labelledby="staffCardTitle" hidden>
    <div class="staff-inner">
      <p class="staff-title" id="staffCardTitle"></p>
      <div class="staff-tabs" id="staffTabs"></div>
      <p class="staff-local" id="staffLocal"></p>
      <p class="staff-en" id="staffEn"></p>
      <p class="staff-tip" id="staffTip"></p>
      <div class="staff-actions">
        <button type="button" id="staffSpeak"></button>
        <button type="button" id="staffClose"></button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
